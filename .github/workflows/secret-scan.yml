name: secret-scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # weekly defence-in-depth — picks up drifts that slipped past PR review
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (history + working tree)
        uses: gitleaks/gitleaks-action@v2
        env:
          # gitleaks-action sets its own exit code from the report;
          # the token is only used for the optional PR comment.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-secret:
    name: trivy secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install trivy
        run: |
          curl -fsSL https://github.com/aquasecurity/trivy/releases/latest/download/trivy_Linux-64bit.tar.gz \
            | sudo tar -xz -C /usr/local/bin trivy

      - name: trivy fs --scanners secret
        run: |
          set -e
          if trivy fs --scanners secret --exit-code 1 --quiet --no-progress . ; then
            echo "trivy: clean"
          else
            echo "::error::trivy found secrets"
            exit 1
          fi
